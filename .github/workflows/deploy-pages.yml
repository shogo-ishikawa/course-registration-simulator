name: GitHub Pagesへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v6

      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 更新日時とコミットを設定
        shell: bash
        run: |
          echo "VITE_BUILD_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: データを検証
        run: npm run check

      - name: 静的サイトをビルド
        run: npm run build

      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5

      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ反映
        id: deployment
        uses: actions/deploy-pages@v4
